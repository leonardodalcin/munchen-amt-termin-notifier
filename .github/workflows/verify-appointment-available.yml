name: Verify Munich appointment availability

on:
  # Run every 10 minutes.
  schedule:
    - cron: "*/10 * * * *"
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

# Avoid overlapping scheduled runs.
concurrency:
  group: termin-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check for available appointments
        run: npm start
        env:
          # Defaults target "Umschreibung eines ausländischen Führerscheins".
          # Override here (or via repo variables) to watch a different service/office.
          OFFICE_ID: ${{ vars.OFFICE_ID || '10308174' }}
          SERVICE_ID: ${{ vars.SERVICE_ID || '1071896' }}
          SERVICE_COUNT: ${{ vars.SERVICE_COUNT || '1' }}
          DAYS_AHEAD: ${{ vars.DAYS_AHEAD || '90' }}
          NOT_AFTER: ${{ vars.NOT_AFTER || '' }}
          # Optional push notifications: set these as repository secrets to enable.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # When a slot is found the script exits non-zero -> this run is marked
          # "failed" and GitHub emails you. That failure is the notification.
