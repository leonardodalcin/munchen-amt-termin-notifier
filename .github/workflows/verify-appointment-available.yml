name: Verify Munich appointment availability

on:
  # Run every 5 minutes.
  schedule:
    - cron: "*/5 * * * *"
  # Manual run — pick one service or all.
  workflow_dispatch:
    inputs:
      service:
        description: "Which service to check"
        required: true
        default: all
        type: choice
        # Keep options in sync with libs/watchlist.ts (GitHub needs static choices).
        options:
          - all
          - führerschein
          - einbürgerung
          - aufenthaltstitel

# Avoid overlapping scheduled runs.
concurrency:
  group: termin-check
  cancel-in-progress: false

jobs:
  # Build the matrix from watchlist.ts. Manual runs may filter to one service;
  # scheduled runs always check the whole watch-list.
  config:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.load.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - id: load
        env:
          SERVICE_FILTER: ${{ github.event.inputs.service }}
          EVENT: ${{ github.event_name }}
        run: |
          # Manual runs must pick a service (the dropdown enforces this; guard anyway).
          if [ "$EVENT" = "workflow_dispatch" ] && [ -z "$SERVICE_FILTER" ]; then
            echo "::error::Manual runs require a service selection." >&2
            exit 1
          fi
          echo "matrix=$(bun apps/matrix.ts "$SERVICE_FILTER")" >> "$GITHUB_OUTPUT"

  check:
    needs: config
    runs-on: ubuntu-latest
    strategy:
      # One service finding a slot (and failing) must not cancel the others.
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.config.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Check ${{ matrix.service.name }}
        run: bun apps/check.ts
        env:
          SERVICE_NAME: ${{ matrix.service.name }}
          SERVICE_ID: ${{ matrix.service.serviceId }}
          OFFICE_ID: ${{ matrix.service.officeId }}
          SERVICE_COUNT: ${{ matrix.service.serviceCount || 1 }}
          DAYS_AHEAD: ${{ matrix.service.daysAhead || vars.DAYS_AHEAD || '90' }}
          NOT_AFTER: ${{ matrix.service.notAfter || '' }}
          # German HTTP(S) proxy — only used for captcha-gated services (the
          # captcha host is only resolvable from inside Germany). Non-captcha
          # services run direct, so they keep working even if the proxy is down.
          # Set as the repo secret PROXY_URL (see docs/german-proxy.md).
          MUC_PROXY_URL: ${{ matrix.service.captcha && secrets.PROXY_URL || '' }}
          # When a slot is found the job exits non-zero -> the run is marked
          # "failed" and GitHub emails you. A red run here is good news.
