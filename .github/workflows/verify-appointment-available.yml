name: Verify Munich appointment availability

on:
  # Run every 10 minutes.
  schedule:
    - cron: "*/10 * * * *"
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

# Avoid overlapping scheduled runs.
concurrency:
  group: termin-check
  cancel-in-progress: false

jobs:
  # Type-check the TypeScript with tsc before doing anything else.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  # Load the watch-list (services.json) into a matrix so each service is a job.
  config:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.load.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - id: load
        run: echo "matrix=$(bun -e 'process.stdout.write(JSON.stringify(require(\"./services.json\")))')" >> "$GITHUB_OUTPUT"

  check:
    needs: [typecheck, config]
    runs-on: ubuntu-latest
    strategy:
      # One service finding a slot (and failing) must not cancel the others.
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.config.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Check ${{ matrix.service.name }}
        run: bun check.ts
        env:
          SERVICE_NAME: ${{ matrix.service.name }}
          SERVICE_ID: ${{ matrix.service.serviceId }}
          OFFICE_ID: ${{ matrix.service.officeId }}
          SERVICE_COUNT: ${{ matrix.service.serviceCount || 1 }}
          DAYS_AHEAD: ${{ matrix.service.daysAhead || vars.DAYS_AHEAD || '90' }}
          NOT_AFTER: ${{ matrix.service.notAfter || '' }}
          # German HTTP(S) proxy/VPN — required for captcha-gated services
          # (the captcha host is only resolvable from inside Germany).
          MUC_PROXY_URL: ${{ secrets.MUC_PROXY_URL }}
          # When a slot is found the job exits non-zero -> the run is marked
          # "failed" and GitHub emails you. A red run here is good news.
